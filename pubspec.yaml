name: quiz_generator
description: A Flutter app to generate quizzes using OpenAI API
publish_to: 'none'

version: 1.0.0+0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  collection: ^1.17.2
  provider: ^6.0.5

  # HTTP requests
  http: ^1.2.1

  # Environment variables (.env)
  flutter_dotenv: ^5.1.0

  # Shared preferences
  shared_preferences: ^2.2.2
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - .env
